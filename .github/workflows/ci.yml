name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  build-and-test:
    name: Bygg och Testa
    runs-on: ubuntu-latest
    steps:
      - name: Bygg
        uses: actions/checkout@v4

      - name: Testa
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release