name: CI
on:
    workflow_dispatch:
    pull_request:
        branches: [ main ]
    push:
        branches: [ main ]
jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
        - name: Bygg
          uses: actions/checkout@v7.0.x
        
        - name: Testa
          uses: actions/setup-dotnet@v7.0.x
          with:
            dotnet-version: 10.0.x
            
        - run: dotnet restore
        - run: dotnet build --no-restore --configuration Release
        - run: dotnet test --no-build --configuration Release
    
